
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronicles of Amara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap');
        
        html, body {
            height: 100dvh; /* Use dynamic viewport height for mobile browsers */
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020617;
            color: #f1f5f9;
            font-family: 'Lora', serif;
        }
        
        #root {
            height: 100%;
        }

        .font-header {
            font-family: 'Cinzel', serif;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .rpg-button {
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .rpg-button:hover {
            transform: translateY(-1px);
            filter: brightness(1.2);
        }
        .rpg-panel {
            background: rgba(15, 23, 42, 0.98);
            border: 1px solid rgba(148, 163, 184, 0.1);
            backdrop-filter: blur(12px);
        }

        @keyframes sync-pulse {
          0% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.5; transform: scale(1.1); }
          100% { opacity: 1; transform: scale(1); }
        }
        .animate-sync {
          animation: sync-pulse 1.5s infinite ease-in-out;
        }

        @keyframes waveform-anim {
          0% { height: 20%; }
          50% { height: 100%; }
          100% { height: 20%; }
        }
        .animate-waveform {
          animation: waveform-anim 0.6s infinite ease-in-out;
        }

        /* Prevent zooming on input focus for iOS */
        @media screen and (max-width: 768px) {
            input, textarea, select {
                font-size: 16px !important;
            }
        }
    </style>
<script type="importmap">

</head>

</body>
</html>
